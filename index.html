<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KENTA.CITY — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loader">
    <div class="loader-content">
      <div class="loader-city-icon">🏙️</div>
      <div class="loader-title">KENTA.CITY</div>
      <div class="loader-sub">Loading the city...</div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- PARTICLE LAYER -->
  <canvas id="particles"></canvas>

  <!-- CITY VIEW -->
  <div id="city-view">

    <!-- Sky / Atmosphere -->
    <div class="city-sky"></div>

    <!-- Ambient Glow overlays -->
    <div class="ambient-glow glow-blue"></div>
    <div class="ambient-glow glow-pink"></div>
    <div class="ambient-glow glow-orange"></div>

    <!-- HUD Header -->
    <header class="city-hud">
      <div class="hud-logo">🏙 KENTA.CITY</div>
      <div class="hud-time" id="hud-time">00:00</div>
      <div class="hud-status">● ONLINE</div>
    </header>

    <!-- ISOMETRIC CITY SCENE -->
    <div class="iso-scene" id="iso-scene">

      <!-- ROAD GRID -->
      <div class="road road-h road-main"></div>
      <div class="road road-v road-main"></div>
      <div class="road road-h road-sub1"></div>
      <div class="road road-v road-sub2"></div>

      <!-- Road markings -->
      <div class="road-marking rm-1"></div>
      <div class="road-marking rm-2"></div>
      <div class="road-marking rm-3"></div>
      <div class="crosswalk cw-1"></div>
      <div class="crosswalk cw-2"></div>

      <!-- ===== BUILDING: KENTA HOUSE (About Me) ===== -->
      <div class="building building-house" id="b-about" data-zone="about" title="About Avenue">
        <div class="b-shadow"></div>
        <div class="b-ground"></div>
        <div class="b-wall b-wall-front">
          <div class="b-window win-warm"></div>
          <div class="b-window win-warm"></div>
          <div class="b-door"></div>
        </div>
        <div class="b-wall b-wall-side">
          <div class="b-window win-warm small"></div>
        </div>
        <div class="b-roof"></div>
        <div class="b-roof-peak"></div>
        <div class="b-chimney"></div>
        <div class="building-label">
          <span class="label-jp">ケンタの家</span>
          <span class="label-en">ABOUT AVENUE</span>
        </div>
        <div class="b-light-cone"></div>
      </div>

      <!-- ===== BUILDING: PROJECT TOWER ===== -->
      <div class="building building-tower" id="b-projects" data-zone="projects" title="Project Plaza">
        <div class="b-shadow"></div>
        <div class="b-ground b-ground-office"></div>
        <div class="b-wall b-wall-front office-front">
          <div class="b-window win-blue"></div>
          <div class="b-window win-blue"></div>
          <div class="b-window win-blue"></div>
          <div class="b-window win-blue"></div>
          <div class="b-window win-blue"></div>
          <div class="b-window win-blue"></div>
          <div class="b-lobby"></div>
        </div>
        <div class="b-wall b-wall-side office-side">
          <div class="b-window win-blue small"></div>
          <div class="b-window win-blue small"></div>
          <div class="b-window win-blue small"></div>
        </div>
        <div class="b-roof office-roof"></div>
        <div class="b-antenna"></div>
        <div class="b-antenna-light"></div>
        <div class="building-label">
          <span class="label-jp">プロジェクト</span>
          <span class="label-en">MY PROJECTS</span>
        </div>
        <div class="b-light-cone blue-cone"></div>
        <div class="neon-sign sign-office">DEV LAB</div>
      </div>

      <!-- ===== BUILDING: SOCIAL CAFE ===== -->
      <div class="building building-cafe" id="b-social" data-zone="social" title="Social Street">
        <div class="b-shadow"></div>
        <div class="b-ground b-ground-cafe"></div>
        <div class="b-wall b-wall-front cafe-front">
          <div class="b-window win-warm"></div>
          <div class="b-window win-warm"></div>
          <div class="cafe-awning"></div>
        </div>
        <div class="b-wall b-wall-side cafe-side"></div>
        <div class="b-roof cafe-roof"></div>
        <div class="building-label">
          <span class="label-jp">ソーシャルカフェ</span>
          <span class="label-en">SOCIAL STREET</span>
        </div>
        <div class="neon-sign sign-cafe">OPEN 24H</div>
        <div class="speech-bubble">💬</div>
        <div class="b-light-cone pink-cone"></div>
      </div>

      <!-- ===== BUILDING: OTAKU ARCADE ===== -->
      <div class="building building-arcade" id="b-otaku" data-zone="otaku" title="Otaku Lane">
        <div class="b-shadow"></div>
        <div class="b-ground b-ground-arcade"></div>
        <div class="b-wall b-wall-front arcade-front">
          <div class="b-window win-neon"></div>
          <div class="b-window win-neon"></div>
        </div>
        <div class="b-wall b-wall-side arcade-side"></div>
        <div class="b-roof arcade-roof"></div>
        <div class="building-label">
          <span class="label-jp">オタクレーン</span>
          <span class="label-en">OTAKU LANE</span>
        </div>
        <div class="neon-sign sign-arcade">ANIME ARCADE</div>
        <div class="b-light-cone purple-cone"></div>
      </div>

      <!-- ===== BUILDING: MUSIC SHOP ===== -->
      <div class="building building-music" id="b-music" data-zone="music" title="Music Spot">
        <div class="b-shadow"></div>
        <div class="b-ground b-ground-music"></div>
        <div class="b-wall b-wall-front music-front">
          <div class="b-window win-warm"></div>
          <div class="b-window win-warm"></div>
          <div class="vinyl-record">🎵</div>
        </div>
        <div class="b-wall b-wall-side music-side"></div>
        <div class="b-roof music-roof"></div>
        <div class="building-label">
          <span class="label-jp">音楽スポット</span>
          <span class="label-en">MUSIC SPOT</span>
        </div>
        <div class="neon-sign sign-music">RECORDS</div>
        <div class="b-light-cone orange-cone"></div>
      </div>

      <!-- ===== SECRET: BACK ALLEY ===== -->
      <div class="building building-alley" id="b-secret" data-zone="secret" title="Back Alley">
        <div class="b-shadow"></div>
        <div class="b-ground b-ground-alley"></div>
        <div class="b-wall b-wall-front alley-front">
          <div class="b-window win-red"></div>
        </div>
        <div class="b-wall b-wall-side alley-side"></div>
        <div class="b-roof alley-roof"></div>
        <div class="building-label secret-label">
          <span class="label-jp">???</span>
          <span class="label-en">BACK ALLEY</span>
        </div>
        <div class="neon-sign sign-alley">??</div>
      </div>

      <!-- FOUNTAIN / PLAZA CENTER -->
      <div class="plaza-center">
        <div class="fountain">
          <div class="fountain-base"></div>
          <div class="fountain-water"></div>
          <div class="fountain-spray"></div>
        </div>
        <div class="plaza-label">PROJECT PLAZA</div>
      </div>

      <!-- STREET TREES -->
      <div class="street-tree tree-1"><div class="tree-top"></div><div class="tree-trunk"></div></div>
      <div class="street-tree tree-2"><div class="tree-top"></div><div class="tree-trunk"></div></div>
      <div class="street-tree tree-3"><div class="tree-top"></div><div class="tree-trunk"></div></div>
      <div class="street-tree tree-4"><div class="tree-top"></div><div class="tree-trunk"></div></div>

      <!-- STREET LAMPS -->
      <div class="lamp lamp-1"><div class="lamp-post"></div><div class="lamp-head"></div><div class="lamp-glow"></div></div>
      <div class="lamp lamp-2"><div class="lamp-post"></div><div class="lamp-head"></div><div class="lamp-glow"></div></div>
      <div class="lamp lamp-3"><div class="lamp-post"></div><div class="lamp-head"></div><div class="lamp-glow"></div></div>
      <div class="lamp lamp-4"><div class="lamp-post"></div><div class="lamp-head"></div><div class="lamp-glow"></div></div>

      <!-- CARS (animated) -->
      <div class="car car-1">🚗</div>
      <div class="car car-2">🚙</div>
      <div class="car car-3">🚕</div>

      <!-- CITY MAP MINI (corner) -->
      <div class="mini-map">
        <div class="mm-label">CITY MAP</div>
        <div class="mm-grid">
          <div class="mm-block mm-house"></div>
          <div class="mm-block mm-tower"></div>
          <div class="mm-block mm-cafe"></div>
          <div class="mm-block mm-arcade"></div>
          <div class="mm-block mm-music"></div>
          <div class="mm-dot you-are-here">★</div>
        </div>
      </div>

    </div><!-- end iso-scene -->

    <!-- Bottom HUD icons -->
    <div class="bottom-hud">
      <button class="hud-btn" id="btn-music-toggle" title="Toggle Vibe Music">🎵</button>
      <button class="hud-btn" id="btn-map" title="City Map">🗺</button>
      <button class="hud-btn" id="btn-info" title="Help">❓</button>
    </div>

    <!-- Tooltip -->
    <div class="city-tooltip" id="city-tooltip"></div>

  </div><!-- end city-view -->


  <!-- ===== INTERIOR OVERLAY ===== -->
  <div id="interior-view" class="hidden">
    <div class="interior-bg" id="interior-bg"></div>
    <div class="interior-container" id="interior-container">
      <button class="back-btn" id="back-btn">← EXIT</button>
      <div class="interior-content" id="interior-content"></div>
    </div>
    <div class="interior-particles" id="interior-particles"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
